<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-label="Modern UK home energy system">
  <defs>
    <linearGradient id="lawn" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#4b9960"/><stop offset="1" stop-color="#235536"/></linearGradient>
    <linearGradient id="drive" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#bbc1c2"/><stop offset=".48" stop-color="#e4e4df"/><stop offset="1" stop-color="#959d9f"/></linearGradient>
    <linearGradient id="render" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fcfaf2"/><stop offset=".52" stop-color="#e8e4d9"/><stop offset="1" stop-color="#c9c5bb"/></linearGradient>
    <linearGradient id="brick" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#bb7658"/><stop offset=".55" stop-color="#94523f"/><stop offset="1" stop-color="#71382e"/></linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#536069"/><stop offset=".5" stop-color="#2e373f"/><stop offset="1" stop-color="#171d22"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#bfe2ed"/><stop offset=".34" stop-color="#6d9aaa"/><stop offset=".38" stop-color="#dff5f8"/><stop offset="1" stop-color="#31505e"/></linearGradient>
    <linearGradient id="solar" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#326a83"/><stop offset=".45" stop-color="#102e43"/><stop offset="1" stop-color="#061520"/></linearGradient>
    <linearGradient id="car" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#dbe5e9"/><stop offset=".35" stop-color="#8fa3ad"/><stop offset="1" stop-color="#344853"/></linearGradient>
    <pattern id="brickwork" width="46" height="22" patternUnits="userSpaceOnUse"><rect width="46" height="22" fill="url(#brick)"/><path d="M0 21.4H46M23 0v21.5M0 11h23M35 11h11" fill="none" stroke="#d59b7e" stroke-opacity=".28" stroke-width="1.3"/></pattern>
    <pattern id="tiles" width="30" height="15" patternUnits="userSpaceOnUse"><rect width="30" height="15" fill="url(#roof)"/><path d="M0 .8h30M0 14.4h30M15 1v13" stroke="#75818a" stroke-opacity=".26"/><path d="M0 8h15M23 8h7" stroke="#101519" stroke-opacity=".38"/></pattern>
    <pattern id="pavers" width="52" height="26" patternUnits="userSpaceOnUse"><rect width="52" height="26" fill="url(#drive)"/><path d="M0 25.5h52M26 0v25.5M0 13h26M39 13h13" stroke="#6e7779" stroke-opacity=".34"/></pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".35"/></filter>
  </defs>

  <ellipse cx="610" cy="617" rx="542" ry="42" fill="#071014" opacity=".3" filter="url(#shadow)"/>
  <path d="M41 577C160 533 303 529 444 548l-24 89H51z" fill="url(#lawn)"/>
  <path d="M410 537c199-20 503-24 712 32l13 71H393z" fill="url(#pavers)"/>
  <path d="M425 535c183-14 417-18 622 16" fill="none" stroke="#f5f2e9" stroke-opacity=".7" stroke-width="4"/>

  <!-- Main modern UK house -->
  <g filter="url(#soft)">
    <path d="M220 286L454 128l301 107 153 74v276H220z" fill="url(#brickwork)"/>
    <path d="M518 258l237-23 153 74v276H518z" fill="url(#render)"/>
    <path d="M190 291L439 105l339 118-28 38-294-96-233 164z" fill="url(#tiles)"/>
    <path d="M439 105l339 118 151 77-22 28-158-67-293-96z" fill="#222b31"/>
    <path d="M456 165l293 96 158 67" fill="none" stroke="#99a4a8" stroke-opacity=".55" stroke-width="5"/>
    <path d="M220 286l236-121 62 93v327H220z" fill="url(#brickwork)"/>
    <path d="M214 284l241-126 70 101" fill="none" stroke="#191f23" stroke-width="9"/>
    <rect x="219" y="573" width="692" height="15" rx="3" fill="#20272a"/>
  </g>

  <!-- Solar array following roof perspective -->
  <g transform="translate(0 2)" filter="url(#soft)">
    <path d="M451 134l253 84-20 57-251-78z" fill="#07131b" stroke="#a6c6d2" stroke-width="3"/>
    <path d="M455 139l78 25-17 56-80-24zm83 27l77 25-18 57-78-25zm82 27l78 26-19 54-77-24z" fill="url(#solar)" stroke="#73aac0" stroke-width="2"/>
    <path d="M495 151l-17 57m97-44l-17 57m99-44l-18 56M448 168l249 80" stroke="#8cc2d6" stroke-opacity=".6" stroke-width="1.2"/>
    <path d="M467 144l228 75" stroke="#d8f5ff" stroke-opacity=".48" stroke-width="4"/>
  </g>

  <!-- Front windows and door -->
  <g filter="url(#soft)">
    <g><rect x="276" y="321" width="83" height="94" rx="3" fill="#e9eee9" stroke="#fefefe" stroke-width="9"/><rect x="284" y="329" width="67" height="78" fill="url(#glass)"/><path d="M317.5 329v78M284 368h67" stroke="#e8f4f4" stroke-width="4"/></g>
    <g><rect x="391" y="290" width="83" height="102" rx="3" fill="#eef1ed" stroke="#fff" stroke-width="9"/><rect x="399" y="298" width="67" height="86" fill="url(#glass)"/><path d="M432.5 298v86M399 341h67" stroke="#edf8f8" stroke-width="4"/></g>
    <g><rect x="275" y="454" width="84" height="103" rx="3" fill="#eef1ed" stroke="#fff" stroke-width="9"/><rect x="283" y="462" width="68" height="87" fill="url(#glass)"/><path d="M317 462v87M283 505h68" stroke="#edf8f8" stroke-width="4"/></g>
    <rect x="402" y="432" width="83" height="142" rx="4" fill="#17262d" stroke="#f4f4ed" stroke-width="9"/>
    <rect x="414" y="445" width="59" height="76" rx="2" fill="url(#glass)"/><circle cx="465" cy="543" r="4" fill="#d6b664"/>
    <path d="M389 577h110l18 13H375z" fill="#aeb3af"/>
  </g>

  <!-- Side windows -->
  <g opacity=".98"><path d="M587 309l102-10v91l-102 5z" fill="#f7f7ef"/><path d="M596 318l84-8v72l-84 5z" fill="url(#glass)"/><path d="M638 314v71M596 351l84-5" stroke="#ecf7f7" stroke-width="4"/>
  <path d="M750 300l98 34v92l-98-25z" fill="#f7f7ef"/><path d="M759 313l80 27v73l-80-20z" fill="url(#glass)"/><path d="M799 326v77M759 353l80 22" stroke="#ecf7f7" stroke-width="4"/></g>

  <!-- Wall-mounted energy equipment -->
  <g filter="url(#soft)">
    <rect x="739" y="444" width="72" height="84" rx="10" fill="#eef3f2" stroke="#8b9ca0" stroke-width="3"/><rect x="751" y="457" width="48" height="29" rx="5" fill="#122b34"/><path d="M763 497h24" stroke="#54e69b" stroke-width="5" stroke-linecap="round"/><circle cx="775" cy="472" r="6" fill="#54e69b"/>
    <g><rect x="824" y="438" width="53" height="128" rx="9" fill="#e8eceb" stroke="#7c8c8f" stroke-width="3"/><rect x="833" y="452" width="35" height="10" rx="4" fill="#152b34"/><rect x="835" y="475" width="31" height="70" rx="5" fill="#d2d9d8"/><path d="M844 493h13M844 509h13M844 525h13" stroke="#55d990" stroke-width="4" stroke-linecap="round"/></g>
    <g><rect x="883" y="438" width="53" height="128" rx="9" fill="#e8eceb" stroke="#7c8c8f" stroke-width="3"/><rect x="892" y="452" width="35" height="10" rx="4" fill="#152b34"/><rect x="894" y="475" width="31" height="70" rx="5" fill="#d2d9d8"/><path d="M903 493h13M903 509h13M903 525h13" stroke="#55d990" stroke-width="4" stroke-linecap="round"/></g>
    <path d="M775 528v34h134v-21" fill="none" stroke="#293d42" stroke-width="5"/>
    <rect x="944" y="449" width="36" height="58" rx="11" fill="#142930" stroke="#6adfa2" stroke-width="3"/><circle cx="962" cy="469" r="7" fill="#54e69b"/><path d="M962 507v25c0 14 16 13 16 26" fill="none" stroke="#1d3035" stroke-width="5"/>
  </g>

  <!-- Driveway planting -->
  <g filter="url(#soft)"><rect x="105" y="521" width="78" height="48" rx="5" fill="#675147"/><ellipse cx="144" cy="510" rx="50" ry="38" fill="#397549"/><circle cx="113" cy="513" r="23" fill="#4d955a"/><circle cx="164" cy="497" r="29" fill="#2e693e"/><circle cx="177" cy="526" r="23" fill="#438953"/>
  <rect x="520" y="548" width="70" height="31" rx="5" fill="#685247"/><ellipse cx="555" cy="542" rx="41" ry="27" fill="#3e7d4b"/></g>

  <!-- Detailed modern EV -->
  <g transform="translate(705 482)" filter="url(#soft)">
    <ellipse cx="225" cy="119" rx="195" ry="24" fill="#111b20" opacity=".5"/>
    <path d="M31 91c9-30 31-50 71-57l71-13c35-6 61 2 88 25l35 30c34 5 61 16 72 37l-8 25H28l-9-20z" fill="url(#car)" stroke="#22343e" stroke-width="4"/>
    <path d="M112 42l65-12c29-5 48 1 72 21l24 22-185 1z" fill="#294b5d"/>
    <path d="M183 32l-6 41M253 54l-70 19" stroke="#c5e5ef" stroke-opacity=".7" stroke-width="3"/>
    <path d="M52 83c84-12 200-11 296 19" fill="none" stroke="#eff8fb" stroke-opacity=".65" stroke-width="4"/>
    <path d="M32 111h34" stroke="#f2f8da" stroke-width="10" stroke-linecap="round"/><path d="M331 112h29" stroke="#ff5a61" stroke-width="9" stroke-linecap="round"/>
    <circle cx="92" cy="130" r="32" fill="#172229"/><circle cx="92" cy="130" r="18" fill="#aab7bd"/><circle cx="92" cy="130" r="8" fill="#394a52"/>
    <circle cx="297" cy="130" r="32" fill="#172229"/><circle cx="297" cy="130" r="18" fill="#aab7bd"/><circle cx="297" cy="130" r="8" fill="#394a52"/>
    <path d="M132 78h97" stroke="#263a44" stroke-width="3"/><rect x="212" y="80" width="24" height="6" rx="3" fill="#263a44"/>
  </g>

  <!-- Roof wind instrument -->
  <g transform="translate(690 180)" stroke="#dbe8e9" stroke-width="4" fill="none" filter="url(#soft)"><path d="M0 42V0"/><circle cy="-3" r="5" fill="#54e69b"/><path d="M0 4l-24-14M0 4l25-13M0 4v-29"/><circle cx="-28" cy="-12" r="8"/><circle cx="28" cy="-12" r="8"/><circle cy="-30" r="8"/></g>
</svg>

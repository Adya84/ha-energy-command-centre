name: Release

on:
  push:
    branches:
      - main
    paths:
      - custom_components/energy_command_centre/manifest.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run frontend tests
        run: node --test tests/*.test.mjs

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          ignore: topics

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

      - name: Update latest prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="latest"
          TITLE="Energy Command Centre — Latest alpha"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --target "$GITHUB_SHA" --title "$TITLE" --notes "" --prerelease
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TITLE" --notes "" --prerelease
          fi

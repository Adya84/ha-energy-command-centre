name: Release

on:
  push:
    branches:
      - main
    paths:
      - custom_components/energy_command_centre/manifest.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run frontend tests
        run: node --test tests/*.test.mjs

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          ignore: topics

      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

      - name: Read integration version
        id: version
        run: |
          VERSION=$(python -c 'import json; print(json.load(open("custom_components/energy_command_centre/manifest.json"))["version"])')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi

          args=(
            --target "$GITHUB_SHA"
            --title "Energy Command Centre $VERSION"
            --generate-notes
          )

          if [[ "$VERSION" == *-* ]]; then
            args+=(--prerelease)
          fi

          gh release create "$TAG" "${args[@]}"
